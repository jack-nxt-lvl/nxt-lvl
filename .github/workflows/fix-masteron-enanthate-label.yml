name: Fix Masteron Enanthate label

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-masteron-enanthate-label.yml'

permissions:
  contents: write

jobs:
  fix-masteron-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix only Masteron ester label and refresh product cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('products-data-original.js')
          loader_path = Path('products-data.js')
          index_path = Path('index.html')

          data = data_path.read_text(encoding='utf-8')
          loader = loader_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          anchor = "id: 'masteron'"
          if data.count(anchor) != 1:
              raise SystemExit('Expected exactly one Masteron product')
          start = data.index(anchor)
          end = data.find("\n  },", start)
          block = data[start:end]
          old = "aka: 'Drostanolone Propionate'"
          new = "aka: 'Drostanolone Enanthate'"
          if block.count(old) != 1:
              raise SystemExit('Expected Masteron Propionate label not found exactly once')
          block = block.replace(old, new, 1)
          data = data[:start] + block + data[end:]

          import re
          loader_new, n1 = re.subn(r'/products-data-original\.js\?v=[^"<]+', '/products-data-original.js?v=masteron-e-20260819-2155', loader, count=1)
          if n1 != 1:
              raise SystemExit('Could not refresh products-data-original cache key')
          index_new, n2 = re.subn(r'products-data\.js\?v=[^"<]+', 'products-data.js?v=masteron-e-20260819-2155', index, count=1)
          if n2 != 1:
              raise SystemExit('Could not refresh storefront product loader cache key')

          data_path.write_text(data, encoding='utf-8')
          loader_path.write_text(loader_new, encoding='utf-8')
          index_path.write_text(index_new, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          grep -A8 "id: 'masteron'" products-data-original.js | grep -q "aka: 'Drostanolone Enanthate'"
          grep -q 'masteron-e-20260819-2155' products-data.js
          grep -q 'masteron-e-20260819-2155' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-masteron-enanthate-label.yml
          git add products-data-original.js products-data.js index.html
          git commit -m "Fix Masteron Enanthate label and refresh storefront data"
          git push
