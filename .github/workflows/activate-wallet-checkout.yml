name: Activate wallet checkout helper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/activate-wallet-checkout.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load stable checkout, payment guide, and final payment upgrade
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          for filename in [
              'product-vial-visuals.js',
              'freeze-dried-research-info.js',
              'storefront-layout-upgrade.js',
              'checkout-wallet-enhancements.js',
              'checkout-conversion-upgrades.js',
              'swaps-checkout-enhancements.js',
              'more-wallets-checkout.js',
              'checkout-moonpay-color-upgrade.js',
              'checkout-usdt-recommended.js',
              'payment-delivery-guide.js',
              'payment-completion-upgrade.js',
              'payment-live-confirmation.js',
              'customer-checkout-upgrade.js',
              'checkout-payment-handoff-fix.js',
              'applepay-card-emphasis.js',
          ]:
              html = re.sub(rf'\s*<script src="{re.escape(filename)}(?:\?v=[^"]+)?"></script>', '', html)

          scripts = [
              ('checkout-wallet-enhancements.js', '20260818-6'),
              ('payment-delivery-guide.js', '20260818-4'),
              ('payment-completion-upgrade.js', '20260818-5'),
              ('payment-live-confirmation.js', '20260818-1'),
              ('customer-checkout-upgrade.js', '20260818-3'),
              ('checkout-payment-handoff-fix.js', '20260818-2'),
              ('applepay-card-emphasis.js', '20260818-1'),
              ('nav-cleanup.js', '20260818-1'),
              ('pt141-product.js', '20260818-2'),
              ('bac-water-product.js', '20260818-1'),
              ('glutathione-product.js', '20260818-1'),
          ]

          for filename, version in scripts:
              tag = f'<script src="{filename}?v={version}"></script>'
              pattern = rf'<script src="{re.escape(filename)}(?:\?v=[^"]+)?"></script>'
              if re.search(pattern, html):
                  html = re.sub(pattern, tag, html, count=1)
              else:
                  if '</body>' not in html:
                      raise SystemExit('Could not find </body> in index.html')
                  html = html.replace('</body>', f'  {tag}\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit activation
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Apple Pay and card emphasis"
          git push

# Trigger Apple Pay and card emphasis deployment.
