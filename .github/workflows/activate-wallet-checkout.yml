name: Activate wallet checkout helper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/activate-wallet-checkout.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load fresh checkout helpers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          wallet = '<script src="checkout-wallet-enhancements.js?v=20260818-5"></script>'
          wallet_pattern = r'<script src="checkout-wallet-enhancements\.js(?:\?v=[^"]+)?"></script>'
          conversion = '<script src="checkout-conversion-upgrades.js?v=20260818-1"></script>'
          conversion_pattern = r'<script src="checkout-conversion-upgrades\.js(?:\?v=[^"]+)?"></script>'

          if re.search(wallet_pattern, html):
              html = re.sub(wallet_pattern, wallet, html, count=1)
          else:
              html = html.replace('</body>', f'  {wallet}\n</body>', 1)

          if re.search(conversion_pattern, html):
              html = re.sub(conversion_pattern, conversion, html, count=1)
          else:
              html = html.replace('</body>', f'  {conversion}\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit activation
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load conversion-focused checkout upgrades"
          git push

# Trigger conversion-focused checkout deployment.
