name: Activate wallet checkout helper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/activate-wallet-checkout.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load fresh checkout helpers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          scripts = [
              ('checkout-wallet-enhancements.js', '20260818-5'),
              ('checkout-conversion-upgrades.js', '20260818-1'),
              ('swaps-checkout-enhancements.js', '20260818-1'),
              ('more-wallets-checkout.js', '20260818-1'),
              ('checkout-moonpay-color-upgrade.js', '20260818-1'),
              ('checkout-usdt-recommended.js', '20260818-1'),
              ('payment-delivery-guide.js', '20260818-1'),
              ('nav-cleanup.js', '20260818-1'),
              ('pt141-product.js', '20260818-2'),
              ('bac-water-product.js', '20260818-1'),
              ('glutathione-product.js', '20260818-1'),
              ('product-vial-visuals.js', '20260818-3'),
              ('storefront-layout-upgrade.js', '20260818-1'),
          ]

          for filename, version in scripts:
              tag = f'<script src="{filename}?v={version}"></script>'
              pattern = rf'<script src="{re.escape(filename)}(?:\?v=[^"]+)?"></script>'
              if re.search(pattern, html):
                  html = re.sub(pattern, tag, html, count=1)
              else:
                  if '</body>' not in html:
                      raise SystemExit('Could not find </body> in index.html')
                  html = html.replace('</body>', f'  {tag}\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit activation
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load storefront layout upgrade"
          git push

# Trigger storefront layout and vial-rendering deployment.
