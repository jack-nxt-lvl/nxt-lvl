name: Force storefront product loader refresh

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/force-product-loader-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change only product loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="products-data.js?v=hgh150-20260818b"></script>'
          new = '<script src="products-data.js?v=masteron-20260819-2150"></script>'
          if text.count(old) != 1:
              raise SystemExit('Expected product loader script tag not found exactly once; refusing to change anything')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and clean up workflow
        run: |
          grep -q 'products-data.js?v=masteron-20260819-2150' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/force-product-loader-refresh.yml
          git add index.html
          git commit -m "Force storefront to load latest product pricing"
          git push
