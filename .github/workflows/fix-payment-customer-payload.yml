name: Fix payment customer payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-payment-customer-payload.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment requests
        shell: python
        run: |
          from pathlib import Path

          patches = {
            'moonpay-assisted-handoff.js': [
              ("body:JSON.stringify({amount:d.total,payCurrency,orderId:'NXT-'+Date.now(),description:'NXT LVL Research order'})",
               "body:JSON.stringify({amount:d.total,payCurrency,orderId:'NXT-'+Date.now(),customer:d.customer,items:(typeof cart!=='undefined'&&Array.isArray(cart)?cart:[])})")
            ],
            'checkout-payment-handoff-fix.js': [
              ("body:JSON.stringify({amount:Number(details.total),payCurrency,orderId:'NXT-'+Date.now(),description:'NXT LVL Research order'})",
               "body:JSON.stringify({amount:Number(details.total),payCurrency,orderId:'NXT-'+Date.now(),customer:details.customer||{},items:items()})")
            ]
          }

          changed = False
          for filename, reps in patches.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            original = text
            for old, new in reps:
              if old not in text:
                raise SystemExit(f'Expected payment request not found in {filename}')
              text = text.replace(old, new, 1)
            if text != original:
              p.write_text(text, encoding='utf-8')
              changed = True

          # Force a fresh browser copy of both patched scripts.
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          import re
          html = re.sub(r'checkout-payment-handoff-fix\.js\?v=[^\"]+', 'checkout-payment-handoff-fix.js?v=20260818-3', html)
          html = re.sub(r'moonpay-assisted-handoff\.js\?v=[^\"]+', 'moonpay-assisted-handoff.js?v=20260818-3', html)
          p.write_text(html, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moonpay-assisted-handoff.js checkout-payment-handoff-fix.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pass customer details into payment creation"
          git push
