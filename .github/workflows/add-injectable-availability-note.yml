name: Add non-transactional injectable availability note

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-injectable-availability-note.yml'

permissions:
  contents: write

jobs:
  add-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add display-only 1-5 vial availability note
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          card_old = "      <div class=\"card-desc\">${p.shortDesc}</div>\n      <div class=\"card-tags\">"
          card_new = "      <div class=\"card-desc\">${p.shortDesc}</div>\n      ${['equipoise','deca','npp','tren-ace'].includes(p.id) ? `<div style=\"margin-top:10px;padding:8px 10px;border:1px solid rgba(167,139,250,.16);border-radius:7px;color:#c4b5fd;font-size:.72rem;font-weight:700;letter-spacing:.3px;\">Available quantities: 1–5 vials</div>` : ''}\n      <div class=\"card-tags\">"
          if text.count(card_old) != 1:
              raise SystemExit('Card description anchor not found exactly once')
          text = text.replace(card_old, card_new, 1)

          modal_old = "        <p>${p.description}</p>\n      </div>\n      <div class=\"modal-section\">\n        <h3>Key Benefits</h3>"
          modal_new = "        <p>${p.description}</p>\n        ${['equipoise','deca','npp','tren-ace'].includes(p.id) ? `<p style=\"margin-top:10px;color:#c4b5fd;font-weight:700;\">Available quantities: 1–5 vials</p>` : ''}\n      </div>\n      <div class=\"modal-section\">\n        <h3>Key Benefits</h3>"
          if text.count(modal_old) != 1:
              raise SystemExit('Modal overview anchor not found exactly once')
          text = text.replace(modal_old, modal_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify scope and commit
        run: |
          grep -q "Available quantities: 1–5 vials" index.html
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(index\.html|\.github/workflows/add-injectable-availability-note\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-injectable-availability-note.yml
          git add index.html
          git commit -m "Show 1-5 vial availability note on selected injectables"
          git push
