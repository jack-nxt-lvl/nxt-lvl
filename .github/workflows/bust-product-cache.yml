name: Refresh product data cache key

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bust-product-cache.yml'

permissions:
  contents: write

jobs:
  refresh-cache-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update only product-data cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('products-data.js')
          text = path.read_text(encoding='utf-8')
          old = 'products-data-original.js?v=hgh150-20260818b'
          new = 'products-data-original.js?v=masteron-20260819-2145'
          if text.count(old) != 1:
              raise SystemExit('Expected product loader cache key not found exactly once; refusing to change anything')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify scope and clean up
        run: |
          grep -q "products-data-original.js?v=masteron-20260819-2145" products-data.js
          git diff -- products-data.js | grep -q "masteron-20260819-2145"
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(products-data\.js|\.github/workflows/bust-product-cache\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bust-product-cache.yml
          git add products-data.js
          git commit -m "Refresh product data cache key"
          git push
