name: Refresh live HGH product data only

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-hgh-live-data.yml'

permissions:
  contents: write

jobs:
  refresh-hgh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust product data only
        run: |
          python - <<'PY'
          from pathlib import Path

          # Do not alter checkout/payment logic. Only refresh product-data script URLs.
          loader = Path('products-data.js')
          loader_text = loader.read_text(encoding='utf-8')
          old_loader = "document.write('<script src=\"/products-data-original.js?v=1\"><\\/script>');"
          new_loader = "document.write('<script src=\"/products-data-original.js?v=hgh150-20260818b\"><\\/script>');"
          if old_loader not in loader_text and new_loader not in loader_text:
              raise SystemExit('Expected product database loader line not found; refusing to touch file')
          loader_text = loader_text.replace(old_loader, new_loader, 1)
          loader.write_text(loader_text, encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          old_index = '<script src="products-data.js"></script>'
          old_index_v = '<script src="products-data.js?v=hgh150-20260818b"></script>'
          if old_index in index_text:
              index_text = index_text.replace(old_index, old_index_v, 1)
          elif old_index_v not in index_text:
              raise SystemExit('Expected index product-data script tag not found; refusing to touch file')
          index.write_text(index_text, encoding='utf-8')
          PY

      - name: Verify HGH source and commit loader-only refresh
        run: |
          grep -q "name: 'HGH — 150 IU Kit'" products-data-original.js
          grep -q "10 Vials × 15 IU" products-data-original.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-data.js index.html
          if git diff --cached --quiet; then
            echo "No refresh needed"
            exit 0
          fi
          git commit -m "Force live HGH 150 IU product data refresh"
          git push
