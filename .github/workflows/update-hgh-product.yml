name: Fix HGH product separator only

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-hgh-product.yml'

permissions:
  contents: write

jobs:
  fix-hgh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix HGH catalog separator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('products-data-original.js')
          text = path.read_text(encoding='utf-8')
          old = "\n}\n\n  // ═══════════════════════════════════════\n  // CAPSULES / ORAL"
          new = "\n},\n\n  // ═══════════════════════════════════════\n  // CAPSULES / ORAL"
          assert "name: 'HGH — 150 IU Kit'" in text
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit separator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-data-original.js
          git commit -m "Fix HGH catalog separator"
          git push
