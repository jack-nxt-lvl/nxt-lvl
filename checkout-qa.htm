<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NXT LVL checkout QA — no real payments</title><style>body{background:#080e16;color:white;font:16px system-ui;margin:24px}button{padding:12px;margin:6px}#results{white-space:pre-wrap}h1{font-size:24px}</style><h1>Checkout test — no real payments</h1><p>All wallet requests and API responses on this page are simulated.</p><button id="usdt">Preview USDT</button><button id="btc">Preview BTC</button><button id="eth">Preview ETH</button><button id="details">Preview customer form</button><button id="run">Run behavior checks</button><pre id="results"></pre><script src="/fulfillment-rates.js"></script><script src="/lib/paybis-funding.js"></script><script>
window.qa={mode:'waiting',asset:'USDT',calls:[],copied:[],wallet:[],expires:900000,nonce:0};
window.cart=[{key:'bac-water-10ml::0',productId:'bac-water-10ml',name:'Test laboratory supply',price:16.10,qty:1}];
window.nxtCheckoutDetails={fulfillment:'shipping',customer:{name:'QA Test',email:'qa@example.invalid',phone:'5555550100',address:'100 Test St',city:'Miami',state:'FL',zip:'33137'},researchConsent:{attestation:true,policyVersion:'2026-10-17-final-sale'}};
window.renderCart=()=>{};window.closeCart=()=>{};
Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async value=>qa.copied.push(value)}});
const realFetch=window.fetch.bind(window);
window.fetch=async(url,options={})=>{
 if(!String(url).startsWith('/api/'))return realFetch(url,options);
 const body=JSON.parse(options.body||'{}');qa.calls.push({url,body});
 let code=200,data={};
 if(url.endsWith('card-payment-link-config'))data={cryptoAvailable:true};
 if(url.endsWith('create-direct-payment-quote')){
  if(qa.mode==='quote-error'){code=503;data={error:'Test service unavailable'};}
  else{const asset=body.asset;qa.asset=asset;data={quoteToken:'test-token-'+(++qa.nonce),orderId:'QA-TEST-'+qa.nonce,asset,network:asset==='BTC'?'Bitcoin Mainnet':'Ethereum Mainnet',amount:asset==='BTC'?'0.00028101':'28.100123',amountUnits:asset==='BTC'?'28101':asset==='USDT'?'28100123':'28100123000000000000',totalUsd:'28.10',address:asset==='BTC'?'bc1-test-only-do-not-send':'0x1111111111111111111111111111111111111111',expiresAt:Date.now()+qa.expires,paymentUri:'https://example.invalid/test-wallet',qrDataUrl:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="white"/><text x="15" y="100" font-size="18">TEST QR ONLY</text></svg>')};}
 }
 if(url.endsWith('find-direct-payment')){if(qa.mode==='found'){data={status:'found',txid:'0x'+'a'.repeat(64)};}else{code=202;data={status:'not_found'};}}
 if(url.endsWith('verify-direct-payment')){
  if(qa.mode==='paid'||qa.mode==='found')data={status:'paid',orderId:'QA-TEST',confirmationEmailSent:true,transactionUrl:'https://example.invalid/test-transaction'};
  else if(qa.mode==='review'){code=202;data={status:'manual_review',message:'Test payment requires review. Do not send again.'};}
  else{code=202;data={status:'confirming',message:'Test payment waiting for confirmations.'};}
 }
 if(qa.delay)await new Promise(r=>setTimeout(r,qa.delay));
 return {ok:code>=200&&code<300,status:code,json:async()=>data};
};
function clean(){document.querySelector('.nxt-wallet-close')?.click();document.querySelector('.nxt-wallet-resume')?.remove();document.querySelectorAll('.nxt-wallet-overlay,.nxt-checkout-overlay').forEach(el=>el.remove());sessionStorage.removeItem('nxtActiveDirectPaymentV3');qa.mode='waiting';qa.expires=900000;qa.delay=0;qa.calls=[];qa.copied=[];window.ethereum=undefined;window.cart=[{key:'bac-water-10ml::0',productId:'bac-water-10ml',name:'Test laboratory supply',price:16.10,qty:1}];}
for(const a of ['USDT','BTC','ETH'])document.querySelector('#'+a.toLowerCase()).onclick=()=>{clean();startDirectWalletCheckout(a);};
document.querySelector('#details').onclick=()=>{clean();proceedToCheckout();};
</script><script src="/direct-wallet-checkout.js"></script><script src="/customer-checkout-upgrade.js"></script><script>
const pause=ms=>new Promise(r=>setTimeout(r,ms));const q=s=>document.querySelector(s);let passed=0;
function assert(value,message){if(!value)throw Error(message);passed++;q('#results').textContent+='PASS '+message+'\n';}
q('#run').onclick=async()=>{
 q('#results').textContent='';passed=0;
 try{
  clean();await startDirectWalletCheckout();assert(q('#nxtPayTitle').textContent==='Pay now with USDT','USDT is the default direct payment');assert(qa.calls[0].body.asset==='USDT','Quote request uses USDT');assert(q('.nxt-wallet-network').textContent.includes('Ethereum (ERC-20) only'),'USDT network is unambiguous');assert(!q('[data-buy-help]').open,'Paybis help is collapsed by default');
  q('[data-copy-amount]').click();await pause(20);assert(qa.copied[0]==='28.100123','Amount copy preserves all decimals');q('[data-copy-address]').click();await pause(20);assert(qa.copied[1]==='0x1111111111111111111111111111111111111111','Address copy is exact');
  qa.mode='found';q('[data-check]').click();await pause(650);assert(q('#nxtPaidTitle')?.textContent.includes('all set'),'Detected transfer is verified before success');assert(cart.length===0,'Confirmed payment removes paid items');assert(!sessionStorage.getItem('nxtActiveDirectPaymentV3'),'Confirmed payment clears saved invoice');
  clean();await startDirectWalletCheckout('BTC');assert(q('.nxt-wallet-network').textContent.includes('Bitcoin Mainnet'),'BTC keeps its own network');assert(q('[data-browser-pay]').hidden,'BTC does not offer an Ethereum browser transaction');
  clean();await startDirectWalletCheckout('ETH');q('[data-check]').click();await pause(20);assert(q('.nxt-wallet-verify').open,'ETH without a hash opens manual verification');assert(!qa.calls.some(c=>c.url.endsWith('find-direct-payment')),'ETH does not call unsupported discovery');
  clean();qa.expires=50;await startDirectWalletCheckout('USDT');await pause(1100);assert(q('[data-expired]').hidden===false,'Expired amount shows recovery');assert(!q('[data-open-wallet]').hasAttribute('href')&&q('[data-copy-amount]').disabled&&q('[data-copy-address]').disabled,'Expired quote cannot be opened or copied');assert(q('.nxt-wallet-qr').hidden,'Expired QR is hidden');qa.expires=900000;q('[data-refresh]').click();await pause(50);assert(q('[data-expired]').hidden,'A fresh quote restores payment controls');
  clean();await startDirectWalletCheckout('USDT');qa.mode='review';q('#nxtWalletTxid').value='0x'+'b'.repeat(64);q('[data-verify]').click();await pause(30);assert(!q('#nxtPaidTitle')&&cart.length===1,'Manual review never marks order paid or clears cart');
  clean();qa.mode='quote-error';await startDirectWalletCheckout();assert(q('[data-retry]')&&cart.length===1,'Quote failure offers retry and keeps cart');qa.mode='waiting';q('[data-retry]').click();await pause(40);assert(q('#nxtPayTitle'),'Retry returns to payment without reentering details');
  clean();await startDirectWalletCheckout();qa.delay=80;qa.mode='paid';q('#nxtWalletTxid').value='0x'+'c'.repeat(64);q('[data-verify]').click();q('.nxt-wallet-close').click();await pause(120);assert(cart.length===1&&!q('#nxtPaidTitle'),'A late response cannot mutate a closed checkout');qa.delay=0;
  clean();await startDirectWalletCheckout();qa.mode='paid';window.cart.push({key:'other::0',qty:2});window.cart[0].qty=3;q('#nxtWalletTxid').value='0x'+'d'.repeat(64);q('[data-verify]').click();await pause(30);assert(cart.length===2&&cart[0].qty===2&&cart[1].qty===2,'Payment only removes items from the paid invoice');
  clean();window.ethereum={request:async({method,params})=>{qa.wallet.push({method,params});if(method==='eth_requestAccounts')return ['0x2222222222222222222222222222222222222222'];if(method==='eth_chainId')return '0x1';if(method==='eth_sendTransaction')return '0x'+'e'.repeat(64);}};await startDirectWalletCheckout();q('[data-browser-pay]').click();await pause(30);const transfer=qa.wallet.find(c=>c.method==='eth_sendTransaction').params[0];assert(transfer.to==='0xdAC17F958D2ee523a2206206994597C13D831ec7'&&transfer.data.endsWith(BigInt('28100123').toString(16).padStart(64,'0')),'USDT wallet request targets existing token contract with exact amount');assert(q('[data-browser-pay]').disabled,'Submitted payment cannot be sent again with browser button');
  clean();qa.wallet=[];qa.expires=20;window.ethereum={request:async({method})=>{qa.wallet.push(method);await pause(40);return method==='eth_requestAccounts'?['0x2222222222222222222222222222222222222222']:'0x1';}};await startDirectWalletCheckout();q('[data-browser-pay]').click();await pause(110);assert(!qa.wallet.includes('eth_sendTransaction'),'Quote expiring during wallet connection is never sent');
  clean();await startDirectWalletCheckout();q('.nxt-wallet-close').click();q('[data-resume]').click();assert(q('#nxtPayTitle')&&qa.calls.filter(c=>c.url.endsWith('create-direct-payment-quote')).length===1,'Resume restores same invoice without creating another');
  clean();await proceedToCheckout();assert(q('#nxtPaymentAsset').value==='USDT','Customer details default to USDT');q('#nxtPaymentAsset').value='BTC';q('#nxtPaymentAsset').dispatchEvent(new Event('change'));assert(q('.nxt-checkout-continue').textContent.includes('BTC'),'Pay Now label follows selected wallet');q('.nxt-checkout-continue').click();assert(q('#nxtName').getAttribute('aria-invalid')==='true','Missing details focus and identify the required field');q('.nxt-checkout-cancel').click();
  q('#results').textContent+='\n'+passed+' checks passed. No live payments or messages sent.';
 }catch(error){q('#results').textContent+='\nFAIL '+error.stack;}finally{clean();}
};
</script>
